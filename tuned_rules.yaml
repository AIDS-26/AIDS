attack_mapping:
  version: 1
  description: Canonical attack-type weights for IDS alerts. Rules are ordered from
    highest-confidence/highest-impact matches to lower-confidence matches.
  tiers:
    Low:
    - 1
    - 4
    Medium:
    - 5
    - 7
    High:
    - 8
    - 10
  rules:
  - attack_type: malware_or_reverse_shell
    weight: 10
    tier: High
    match:
      category_exact:
      - A Network Trojan was detected
      signature_contains:
      - Reverse Shell
      - DOS prompt command
    basis: malware or command-shell behavior is a high-impact compromise indicator
  - attack_type: web_application_attack
    weight: 8
    tier: High
    match:
      category_exact:
      - Web Application Attack
      signature_contains:
      - Cross Site Scripting
      - SQL Errors
      - SQL injection
    basis: direct attack against an application-facing endpoint
  - attack_type: credential_brute_force
    weight: 7
    tier: Medium
    match:
      signature_contains:
      - Brute-Force
      - Brute Force
      - Password Guess
    basis: repeated authentication attempts can lead to account compromise
  - attack_type: reconnaissance_or_port_scan
    weight: 5
    tier: Medium
    match:
      signature_contains:
      - Nmap
      - Port Scan
      - Suspicious inbound to
      - VNC Scan
    basis: probing indicates discovery or preparation, but not necessarily compromise
  - attack_type: authentication_protocol_anomaly
    weight: 5
    tier: Medium
    match:
      signature_contains:
      - NTLMv1
      - NTLM Session Setup
      - TLS Handshake Failure
    basis: legacy authentication or protocol failure requires investigation
  - attack_type: suspicious_external_communication
    weight: 4
    tier: Low
    match:
      category_exact:
      - Potentially Bad Traffic
      - Attempted Information Leak
      - Potential Corporate Privacy Violation
      signature_contains:
      - RMM Domain
      - Reverse Shell Connection
    basis: suspicious communication is important but has lower confidence without
      corroboration
  - attack_type: suspicious_dns_or_web_request
    weight: 3
    tier: Low
    match:
      signature_contains:
      - DNS Query
      - Domain in DNS Lookup
      - HTTP Request to
      - User-Agent Outbound
    basis: indicator-level traffic needs correlation before being treated as an attack
  - attack_type: informational_or_benign
    weight: 1
    tier: Low
    severity_override: S
    match:
      category_exact:
      - Not Suspicious Traffic
    basis: informational detection; keep benign severity S
  fallback:
    attack_type: unclassified_detection
    weight: 3
    tier: Low
    evidence: 0.2
    basis: unmatched or unconfirmed IDS detection; review before escalation
